name: Import BakeryProduction v23 release

on:
  push:
    paths:
      - "incoming/Bakery_v23_FINAL_COMPLETE.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import archive while preserving ALP/PNG relative paths
        shell: bash
        run: |
          test -f incoming/Bakery_v23_FINAL_COMPLETE.zip
          python tools/import_v23.py incoming/Bakery_v23_FINAL_COMPLETE.zip

      - name: Validate ALP XML against v22 backup
        shell: bash
        run: |
          python -m pip install lxml
          cd releases/v23
          python verify_v23.py

      - name: Commit imported models and resources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/v23
          if git diff --cached --quiet; then
            echo "No changes after extraction"
            exit 0
          fi
          git commit -m "model: import BakeryProduction v23 models and assets"
          git push
